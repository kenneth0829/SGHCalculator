<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18181c"><meta name="description" content="Calculate motorcycle monthly instalments with SGH. Choose your Yamaha, Honda or custom motorcycle and down payment."><title>SGH Motorcycle Loan Calculator</title>
<style>html{background:#f5f5f7}body{margin:0;padding:24px 16px;font-family:system-ui,sans-serif}@media(max-width:420px){body{padding:12px 8px}}</style></head><body>
<script>
window.openai={widgetState:null,setWidgetState:async(state)=>{window.openai.widgetState=state;try{localStorage.setItem('sgh-calculator',JSON.stringify(state))}catch(_){}}};
try{window.openai.widgetState=JSON.parse(localStorage.getItem('sgh-calculator'))}catch(_){}
</script>
<style>
#motor-loan-calculator{color-scheme:light;--ink:#222226;--sub:#64646e;--paper:#ffffff;--line:#dedee3;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f5f5f7;border-radius:24px;padding:32px;max-width:1080px;margin:0 auto;box-sizing:border-box}
#motor-loan-calculator *{box-sizing:border-box}
#motor-loan-calculator [hidden]{display:none!important}
#motor-loan-calculator .mq-brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;font-weight:700}
#motor-loan-calculator .mq-mark{background:var(--ink);color:#e2f4b3;border-radius:12px;padding:8px 12px;font-size:18px;letter-spacing:-4px;padding-right:16px}
#motor-loan-calculator .mq-heading{margin:26px 0 10px;font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:-1.8px;font-weight:650;color:var(--ink)}
#motor-loan-calculator .mq-heading em{font-family:Georgia,serif;color:#c71625;font-weight:400}
#motor-loan-calculator .mq-intro{color:var(--sub);font-size:15px;line-height:1.6;margin:0 0 28px}
#motor-loan-calculator .mq-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
#motor-loan-calculator .mq-panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}
#motor-loan-calculator .mq-step{display:flex;align-items:center;gap:10px;margin:0 0 22px;font-size:17px;font-weight:650}
#motor-loan-calculator .mq-step span{font-size:11px;background:#fce9ec;color:#a71120;padding:6px 8px;border-radius:8px;letter-spacing:1px}
#motor-loan-calculator .mq-field{display:block;font-size:13px;font-weight:600;margin-bottom:18px;min-width:0}
#motor-loan-calculator input,#motor-loan-calculator select{display:block;width:100%;min-width:0;min-height:48px;margin-top:8px;padding:12px;border:1px solid #d1d1d9;border-radius:10px;background:#fff;color:var(--ink);font:400 16px/1.35 inherit;font-family:inherit;font-size:16px;line-height:1.35;transition:border-color .15s}
#motor-loan-calculator input:focus,#motor-loan-calculator select:focus,#motor-loan-calculator textarea:focus{outline:3px solid #ffd7dd;outline-offset:2px;border-color:#c71625}
#motor-loan-calculator input::placeholder{color:#797982;opacity:1}
#motor-loan-calculator .mq-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#motor-loan-calculator .mq-help{display:block;font-size:12px;line-height:1.5;font-weight:400;color:var(--sub);margin-top:7px}
#motor-loan-calculator #motor-custom{border-top:1px dashed var(--line);padding-top:18px}
#motor-loan-calculator #motor-price{font-size:13px;line-height:1.9;background:#eeeeF2;padding:14px 16px;border-radius:12px;margin:2px 0 0;font-variant-numeric:tabular-nums;color:#4c4c57}
#motor-loan-calculator #motor-price:empty{display:none}
#motor-loan-calculator #motor-error{font-size:13px;line-height:1.6;color:#af1524;margin:16px 0 0}
#motor-loan-calculator .mq-preview{background:#fceff0;border-color:#f0d3d7}
#motor-loan-calculator .mq-preview .mq-step span{background:#f7cdd3}
#motor-loan-calculator .mq-message-label{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--sub);margin-bottom:12px}
#motor-loan-calculator textarea{display:block;width:100%;min-height:230px;border:1px solid #e8d5d8;border-radius:14px;padding:20px 16px;background:#ffffff;color:#222226;font:14px/1.95 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;white-space:pre-wrap;overflow-wrap:break-word}
#motor-loan-calculator #motor-copy{display:block;width:100%;margin-top:18px;min-height:52px;background:#d01828;color:#fff;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;padding:13px 18px;cursor:pointer;box-shadow:0 4px 0 #961020;transition:background .15s,transform .15s}
#motor-loan-calculator #motor-copy:hover{background:#b81120}
#motor-loan-calculator #motor-copy:active{transform:translateY(2px);box-shadow:0 2px 0 #961020}
#motor-loan-calculator #motor-copy:focus-visible{outline:3px solid #ef8c98;outline-offset:4px}
#motor-loan-calculator #motor-copy:disabled{background:#92929a;box-shadow:none;cursor:not-allowed}
#motor-loan-calculator #motor-status{display:block;min-height:22px;margin-top:14px;font-size:12px;line-height:1.5;color:#8b1521;text-align:center}
#motor-loan-calculator .mq-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:24px;font-size:11px;color:var(--sub);letter-spacing:.4px}
#motor-loan-calculator .mq-hero{display:flex;align-items:center;justify-content:space-between;gap:20px}
#motor-loan-calculator .mq-bike{flex:0 0 180px;text-align:center;border-radius:50%;background:radial-gradient(circle,#f5d9df 0%,#f5d9df 58%,transparent 59%);font-size:110px;line-height:1.8;transform:rotate(-5deg)}
#motor-loan-calculator .mq-track{height:8px;width:88px;margin-bottom:18px;background:repeating-linear-gradient(115deg,#c71625 0 10px,transparent 10px 18px)}
@media(max-width:600px){#motor-loan-calculator .mq-bike{flex-basis:75px;font-size:56px}#motor-loan-calculator .mq-hero{gap:8px}}
@media(max-width:740px){#motor-loan-calculator{padding:22px;border-radius:18px}#motor-loan-calculator .mq-layout{grid-template-columns:1fr}#motor-loan-calculator .mq-heading{font-size:36px}}
@media(max-width:420px){#motor-loan-calculator{padding:16px}#motor-loan-calculator .mq-panel{padding:16px}#motor-loan-calculator .mq-pair{grid-template-columns:1fr;gap:0}#motor-loan-calculator .mq-heading{font-size:30px}#motor-loan-calculator textarea{font-size:13px;padding:14px 10px}}
@media(prefers-reduced-motion:reduce){#motor-loan-calculator *{transition:none!important}}

#motor-loan-calculator .mq-brand{background:#18181c;color:#fff;padding:16px 20px;border-radius:16px;gap:18px;letter-spacing:1.7px}
#motor-loan-calculator .mq-logo{display:block;width:82px;height:82px;object-fit:contain;flex-shrink:0}
#motor-loan-calculator .mq-brand-name{display:block;font-size:24px;line-height:1.25;font-weight:750;letter-spacing:3px;margin-bottom:5px}
#motor-loan-calculator .mq-brand-subtitle{display:block;font-size:10px;line-height:1.6;color:#d7d7df;letter-spacing:1.4px}
#motor-loan-calculator .mq-heading em{font-family:inherit;font-style:italic;font-weight:750;letter-spacing:-1.8px}
@media(max-width:420px){#motor-loan-calculator .mq-brand{padding:12px;gap:12px}#motor-loan-calculator .mq-logo{width:60px;height:60px}#motor-loan-calculator .mq-brand-name{font-size:21px}#motor-loan-calculator .mq-brand-subtitle{font-size:9px;letter-spacing:.7px}}
</style>

<script>
(() => {
  const root = document.getElementById('motor-loan-calculator');
  const models = [
    ['Yamaha 135LC FI',10500],['Yamaha Ego Gear Pro 125',7700],['Yamaha Ego Avantiz 125',7500],
    ['Yamaha NVX SP',17000],['Yamaha XSR155',15000],['Yamaha Y16ZR-R Pramac LE',17300],
    ['Yamaha Y16ZR-R',12800],['Yamaha Y15ZR',10900],['Honda Vario 125',9000],
    ['Yamaha Y15ZR SE',11900],['Yamaha 135LC FI 20TH LE',12300],['Honda ADV 160 ABS',15000],
    ['Honda ADV 160 ABS ROADSYNC',15400],['Honda Dash 125',8000],['Yamaha NVX ABS',15000],
    ['Yamaha PG-1',8600],['Yamaha NMAX ABS',13800],['Yamaha EZ115',6800],
    ['Honda Vario 160 ABS SE',12400],['Honda Vario 160 ABS',12000],['Yamaha R15M ABS',16500],
    ['Yamaha MT-15',14200],['Yamaha NVX STD',14300],['Yamaha 135LC FI SE',11300],['Honda Wave Alpha FI',6700],
    ['Yamaha XMAX 250',30000,0.005,[7,6,5,4,3,2]]
  ];
  const select = root.querySelector('#motor-model');
  const deposit = root.querySelector('#motor-deposit');
  const price = root.querySelector('#motor-price');
  const quote = root.querySelector('#motor-quote');
  const error = root.querySelector('#motor-error');
  const copy = root.querySelector('#motor-copy');
  const status = root.querySelector('#motor-status');
  const customPanel = root.querySelector('#motor-custom');
  const customName = root.querySelector('#motor-custom-name');
  const customPrice = root.querySelector('#motor-custom-price');
  const customRate = root.querySelector('#motor-custom-rate');
  const customYears = root.querySelector('#motor-custom-years');
  const money = value => value.toLocaleString('en-MY', {maximumFractionDigits:2});
  ['Yamaha', 'Honda'].forEach(brand => {
    const group = document.createElement('optgroup');
    group.label = brand;
    models.filter(([name]) => name.startsWith(brand + ' ')).forEach(([name]) => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      group.appendChild(option);
    });
    select.appendChild(group);
  });
  const customGroup = document.createElement('optgroup');
  customGroup.label = 'Other makes';
  const customOption = document.createElement('option');
  customOption.value = '__custom__';
  customOption.textContent = 'Custom model — enter your own';
  customGroup.appendChild(customOption);
  select.appendChild(customGroup);
  function render() {
    const isCustom = select.value === '__custom__';
    customPanel.hidden = !isCustom;
    const [name, amount, monthlyRate = 0.00833, terms = [5,4,3,2]] = isCustom
      ? [customName.value.trim(), Number(customPrice.value), Number(customRate.value) / 100,
        Array.from({length:Number(customYears.value)-1}, (_,i) => Number(customYears.value)-i)]
      : models.find(model => model[0] === select.value);
    const nameValid = !isCustom || name.length > 0;
    const priceValid = !isCustom || (customPrice.value.trim() !== '' && Number.isFinite(amount) && amount > 0 && customPrice.validity.valid);
    const rateValid = !isCustom || (/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(customRate.value.trim()) && Number.isFinite(monthlyRate) && monthlyRate >= 0);
    const dp = Number(deposit.value);
    deposit.max = String(amount);
    const depositValid = deposit.value.trim() !== '' && Number.isFinite(dp) && dp >= 0 && dp <= amount && deposit.validity.valid;
    const valid = nameValid && priceValid && rateValid && depositValid;
    error.hidden = valid;
    error.textContent = !nameValid ? 'Enter the motorcycle make and model.' : !priceValid ? 'Enter a selling price greater than RM 0, with up to two decimal places.' : !rateValid ? 'Enter a monthly interest percentage of 0 or more (e.g. 0.5 for 0.5%).' : !depositValid ? 'Enter a down payment from RM 0 to RM ' + money(amount) + ', with up to two decimal places.' : '';
    deposit.setAttribute('aria-invalid', String(!depositValid));
    customName.setAttribute('aria-invalid', String(!nameValid));
    customPrice.setAttribute('aria-invalid', String(!priceValid));
    customRate.setAttribute('aria-invalid', String(!rateValid));
    copy.disabled = !valid;
    price.textContent = priceValid && rateValid ? 'Price RM ' + money(amount) + (valid ? ' · Finance amount RM ' + money(amount - dp) : '') + ' · Monthly flat rate ' + (isCustom ? customRate.value : Number((monthlyRate * 100).toFixed(3))) + '%' : '';
    quote.rows = terms.length + 3;
    quote.value = valid ? [name, '*Down Payment RM ' + money(dp), ...terms.map(years => {
      const principal = amount - dp;
      const months = years * 12;
      const monthly = Math.round((principal * monthlyRate * months + principal) / months);
      return '*Monthly RM ' + money(monthly) + ' X ' + years + ' Years';
    })].join('\n') : '';
    status.textContent = '';
  }
  function restore(state) {
    const saved = state?.modelContent;
    select.value = saved?.model === '__custom__' || models.some(m => m[0] === saved?.model) ? saved.model : 'Yamaha XSR155';
    deposit.value = typeof saved?.downPayment === 'string' || typeof saved?.downPayment === 'number' ? saved.downPayment : '0';
    customName.value = typeof saved?.customName === 'string' ? saved.customName : '';
    customPrice.value = typeof saved?.customPrice === 'string' ? saved.customPrice : '';
    customRate.value = typeof saved?.customRate === 'string' ? saved.customRate : '';
    customYears.value = ['2','3','4','5','6','7'].includes(saved?.customYears) ? saved.customYears : '5';
    render();
  }
  let localState = '';
  function changed() {
    render();
    const state = {modelContent:{model:select.value,downPayment:deposit.value,customName:customName.value,customPrice:customPrice.value,customRate:customRate.value,customYears:customYears.value},privateContent:null};
    localState = JSON.stringify(state.modelContent);
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState(state).catch(() => {});
    }
  }
  select.addEventListener('change', changed);
  deposit.addEventListener('input', changed);
  [customName,customPrice,customRate].forEach(field => field.addEventListener('input', changed));
  customYears.addEventListener('change', changed);
  copy.addEventListener('click', async () => {
    if (copy.disabled) return;
    try {
      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(quote.value);
      status.textContent = 'Copied — ready to paste.';
    } catch (_) {
      quote.focus();
      quote.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_) {}
      status.textContent = copied ? 'Copied — ready to paste.' : 'Message selected. Press Ctrl+C or long-press and choose Copy.';
    }
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals && 'widgetState' in event.detail.globals) {
      const state = event.detail.globals.widgetState;
      // State writes echo back from the host. Do not reset in-progress typing or the caret.
      if (JSON.stringify(state?.modelContent) === localState || root.contains(document.activeElement)) return;
      restore(state);
    }
  });
  restore(window.openai?.widgetState);
})();
</script>
